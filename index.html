<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>1.2</title>
    <script>
      window.addEventListener('error', function(event) {
        var div = document.createElement('div');
        div.style.color = 'red';
        div.style.padding = '20px';
        div.style.background = '#fee2e2';
        div.style.border = '2px solid #ef4444';
        div.style.margin = '20px';
        div.style.fontFamily = 'monospace';
        div.style.whiteSpace = 'pre-wrap';
        div.style.zIndex = '999999';
        div.style.position = 'relative';
        div.innerHTML = '<h3>Unhandled Error:</h3>' + event.message + '\nat ' + event.filename + ':' + event.lineno + ':' + event.colno + '\n\n' + (event.error ? event.error.stack : '');
        document.body.insertBefore(div, document.body.firstChild);
      });
      window.addEventListener('unhandledrejection', function(event) {
        var div = document.createElement('div');
        div.style.color = 'red';
        div.style.padding = '20px';
        div.style.background = '#fee2e2';
        div.style.border = '2px solid #ef4444';
        div.style.margin = '20px';
        div.style.fontFamily = 'monospace';
        div.style.whiteSpace = 'pre-wrap';
        div.style.zIndex = '999999';
        div.style.position = 'relative';
        div.innerHTML = '<h3>Unhandled Promise Rejection:</h3>' + event.reason + '\n\n' + (event.reason ? event.reason.stack : '');
        document.body.insertBefore(div, document.body.firstChild);
      });
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
