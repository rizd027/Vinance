<head>
  <meta charset="UTF-8" />

  <title>Vinance - Manajemen Keuangan Premium</title>
  <meta name="description"
    content="Vinance - Aplikasi manajemen keuangan yang aman, ringan, dan dapat berjalan offline. Kelola anggaran dan transaksi Anda dengan mudah." />
  <meta name="theme-color" content="#6366f1" />
  <link rel="apple-touch-icon" href="/Logo-Vinance.png" />
  <link rel="icon" type="image/png" href="/Logo-Vinance.png" />

  <script>
    // Guard against libraries trying to polyfill fetch in a protected environment
    (function () {
      const originalFetch = window.fetch;
      try {
        Object.defineProperty(window, 'fetch', {
          get: function () { return originalFetch; },
          set: function (v) {
            console.warn('Prevented attempt to overwrite window.fetch');
          },
          configurable: true
        });
      } catch (e) {
        // If we can't redefine it, it's already protected or we're in a very strict environment
      }
    })();
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
